# The gRPC stubs the hub and the site helper share: Muru's admin API,
# generated from the `.proto` file of the pinned Muru release, and the
# helper's own Sources service. `just stubs` writes everything under
# src/muruhosting_stubs/ but its __init__.py; none of it is edited by hand.

[project]
name = "muru-hosting-stubs"
version = "0"   # a proof of concept with no releases
description = "Generated gRPC stubs for muru.admin.v1 and muruhosting.site.v1"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "grpcio>=1.85",
    "protobuf>=7.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muruhosting_stubs"]
