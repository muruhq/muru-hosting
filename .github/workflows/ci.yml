# Lint and documentation on every push and pull request. The lint steps are
# those of `just lint`, kept in step with the justfile.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: sh scripts/check-no-em-dashes.sh
      - run: git ls-files '*.py' | xargs uv run python scripts/check-layout.py
      - run: uv run python scripts/check-user-docs.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --only-group docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
