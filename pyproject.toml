# Development workspace for muru-hosting, a proof of concept that dogfoods
# Muru. Nothing here is published. Muru is used from PyPI at the version
# pinned below, never from its source tree; upgrading it is a change of its
# own (AGENTS.md, "Working with Muru").

[project]
name = "muru-hosting"
version = "0"   # a proof of concept with no releases
description = "A proof of concept hosting control plane for Python web sites on Muru"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0",
    "django-tasks-db>=0.13.0",
    "psycopg[binary]>=3.3.9",
    "wrapture[otel]>=1.0.0b5",
    "wrapture-instrumentation>=1.0.0b3",
    "wrapture-instrumentation-postgresql>=1.0.0b2",
    "grpcio>=1.85",
    "muru-hosting-stubs",
    "unwrapt>=1.0.0a5",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.9",
    "types-docutils>=0.21",
    # The Muru release the stubs, the MCP server and the skill come from.
    "muructl==0.1.0a34",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "django-stubs>=6.1.2",
    # The site helper, so that its tests and the type check run from here.
    "muru-hosting-helper",
    "grpcio-tools>=1.85.3",
    "types-grpcio>=1.85.0.20261028",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
    "sphinx-autobuild>=2024.10",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=1.0",
]

# How Muru serves the hub (specification sections 2 and 15.2). The settings
# all come from the environment; the `just` recipes give a development run
# its own.

[tool.muru]
entrypoint = "hub.wsgi:application"

# A view may hand its request to an ASGI application on the worker's event
# loop, which is how a site's page is streamed its log and events without
# holding a thread (specification section 2.1).
handoff = "asgi"

# The import report records what each import cost as the hub loads, for
# `muructl debug imports`. Like tracing below, it is wanted for development
# runs alone, and is here for every mode only because the run table cannot
# carry it (muruhq/muru#860; #30 here). It adds to every load, a reload included.
import_report = true

# Deferred imports, through unwrapt: a module names the imports to defer in
# its own `__lazy_modules__`, and a `[tool.unwrapt.lazy_modules]` table in
# this file names them for code that is not the hub's. The import report
# says which are worth deferring.
lazy_imports = true

# Tracing is wanted for every development run, where the debug toolbar shows
# each request's tree and queries, and elsewhere only where something
# receives the traces. The run table cannot say that (muruhq/muru#860; #30 here), so
# it is on here, for every mode; move it to [tool.muru.run] when it can.

[tool.muru.tracing]
config = "tracing/wrapture.toml"

# A development run keeps the hub's data in the checkout, where commands run
# without Muru (`manage.py`, the jobs worker) find the same database.

# The ports keep clear of Muru's defaults (8080, 8081 and 8443), which a
# developer's own daemon or another run is likely to hold.

[tool.muru.run]
port = 9080
https_port = 9443
dashboard = "127.0.0.1:9081"
toolbar = true
data_dir = ".muru-hosting/hub"
reload_include = ["**/*.html", "**/*.css"]

[tool.muru.commands.migrate]
description = "Apply the hub's database migrations"
run = ["python", "manage.py", "migrate", "--noinput"]
timeout = "30m"
exclusive = true

[tool.uv]
package = false
default-groups = ["dev", "docs"]

# One environment for the whole repository: the hub at the root, and the
# packages it shares with the site helper.

[tool.uv.workspace]
members = ["packages/*", "helper"]

[tool.uv.sources]
muru-hosting-stubs = { workspace = true }
muru-hosting-helper = { workspace = true }

[tool.ruff]
# The exclusions hold for files named on the command line too, as the
# pre-commit hooks name them.
force-exclude = true
line-length = 100
target-version = "py315"
extend-exclude = [
    "scratch",
    "docs/_build",
    "*.md",
    # Generated by `just stubs`, never edited by hand or by a formatter.
    "packages/stubs/src/muruhosting_stubs/muru",
    "packages/stubs/src/muruhosting_stubs/muruhosting",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "ANN", "RUF"]
ignore = [
    "ANN401",  # Any is sometimes the honest type
    "D105",    # dunder methods implementing standard protocols need no docstring
    "D106",    # a Django model's Meta says what it is
    "D107",    # __init__ is documented on the class
    "D202",    # the project puts a blank line after a function docstring (AGENTS.md)
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["D"]
"**/migrations/*.py" = ["D", "RUF012", "E501"]
"tests/**" = ["D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
strict = true
python_version = "3.15"
warn_unreachable = true
files = ["scripts", "docs/_ext", "hub", "tests", "manage.py", "helper/src", "hello"]
plugins = ["mypy_django_plugin.main"]
# The generated gRPC modules carry no annotations of their own; the messages
# have theirs in the .pyi files beside them.
untyped_calls_exclude = ["muruhosting_stubs"]

[[tool.mypy.overrides]]
module = ["muruhosting_stubs.muru.admin.v1.*", "muruhosting_stubs.muruhosting.site.v1.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "--strict-markers -p wrapture.pytest_plugin"
markers = [
    "postgres: the test needs Postgres, and is skipped unless DATABASE_URL names one",
]
