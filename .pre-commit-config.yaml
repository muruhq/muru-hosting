# Mechanical checks of the rules in AGENTS.md. `just bootstrap` installs these
# as git hooks (pre-commit and commit-msg) in .git/hooks.

repos:
  - repo: local
    hooks:
      - id: no-em-dashes
        stages: [pre-commit]
        name: no em dashes in text files
        entry: sh scripts/check-no-em-dashes.sh
        language: system
        pass_filenames: false

      - id: code-layout
        stages: [pre-commit]
        name: code layout follows the AGENTS.md paragraph rules
        entry: uv run python scripts/check-layout.py
        language: system
        types: [python]
        # Generated by `just stubs`, never edited by hand.
        exclude: ^packages/stubs/src/

      - id: user-docs
        stages: [pre-commit]
        name: user pages describe what muru-hosting does, not what is to come
        entry: uv run python scripts/check-user-docs.py
        language: system
        files: ^docs/.*\.md$

      - id: commit-message
        name: commit message has no agent attribution
        entry: sh scripts/check-commit-message.sh
        language: system
        stages: [commit-msg]

      - id: ruff-format
        stages: [pre-commit]
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        stages: [pre-commit]
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
